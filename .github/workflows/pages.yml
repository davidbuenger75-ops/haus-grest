# Haus Grest – Veröffentlichung auf GitHub Pages
# Veröffentlicht wird nur das Spiel: index.html, manifest, sw.js, js/, css/, assets/ (ohne Originale und Entwürfe).
# Nicht veröffentlicht: tools/, docs/, CLAUDE.md, README.md, assets/original/, assets/*/_kandidaten, _stiltest, _vorlagen.
name: Spiel veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  veroeffentlichen:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Spieldateien zusammenstellen
        run: |
          mkdir _site
          cp index.html manifest.webmanifest sw.js _site/
          cp -r js css assets _site/
          rm -rf _site/assets/original _site/assets/bilder/_* _site/assets/sound/_* _site/assets/bilder/LIESMICH.txt
          echo "Veröffentlicht:"; du -sh _site; find _site -type f | wc -l
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
